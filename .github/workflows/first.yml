## Inputs and Outputs

name: CI/CD | Inputs & Outputs
on:
  workflow_dispatch:
    inputs:
      env:
        type: choice
        options:
          - dev
          - staging
          - prod
      runTests:
        type: boolean
jobs:
  first:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.node.outputs.version }}
    steps:
      - id: node
        run: |
          echo "env: ${{ inputs.env }}"
          echo "runTests: ${{ inputs.runTests }}"
          echo "version=v1.2.0" >> $GITHUB_OUTPUT
      - run: echo "${{ steps.node.outputs.version }}"
  second:
    needs: first
    if: inputs.runTests == true
    runs-on: ubuntu-latest
    steps:
      - run: echo "version ${{ needs.first.outputs.version }}"
