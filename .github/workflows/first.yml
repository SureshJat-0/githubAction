name: CI CD | GitHub actions

on:
  push

jobs:
  demo:
    runs-on:
      ubuntu-latest
    
    steps:
      - run: |
          echo "Files before checkout : "
          ls

      - uses: actions/checkout@v4
      - run: |
          echo "Files after checkout : "
          ls
      
      - run: |
          echo "Node version before setup : "
          node -v

      - uses: actions/setup-node@v4
        with:
          node-version: 24
      
      - run: |
          echo "Node version after setup : "
          node -v
          npm -v
      