name: CI CD | GitHub actions

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  demo:
    runs-on:
      ubuntu-latest
    
    steps:
      - name: Repo clone | actions/checkout 
        run: |
          echo "Files before checkout : "
          ls

      - uses: actions/checkout@v4
        run: |
          echo "Files after checkout : "
          ls
          
      - name: Specific node version | actions/setup-noe with
        run: |
          echo "Node version before setup : "
          node -v

      - uses: actions/setup-node@v4
        with:
          node-version: 24
      
        run: |
          echo "Node version after setup : "
          node -v
          npm -v
      